<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guesses — The Golden Chip Casino</title>

<!--
  ============================================================
  SETUP INSTRUCTIONS
  ============================================================

  This page reads every guess submitted through who_killed_bob.html
  and displays them in a table, plus a quick tally of votes.

  It uses the SAME Supabase project and table as who_killed_bob.html.
  You do NOT need a new table — just point this page at the same
  Supabase project.

  STEP 1 — Allow reading the table
    By default your "guesses" table only allows INSERTS (so guests
    can submit, but nobody can read the results). To let this page
    read the results, open the Supabase SQL Editor and run:

      create policy "Allow public reads"
      on guesses for select
      to anon
      using (true);

    (If you'd rather keep results private, don't run this, and
    instead view your results directly inside Supabase: go to
    Table Editor > guesses in your Supabase dashboard.)

  STEP 2 — Paste your credentials
    Replace SUPABASE_URL and SUPABASE_ANON_KEY below with the
    same values you used in who_killed_bob.html.

  STEP 3 — Host it
    Upload this file next to who_killed_bob.html in the same
    place (e.g. the same GitHub repo). It does not need to be
    linked anywhere public — keep the URL to yourself if you
    want to be the only one who can see the results before
    the big reveal.
  ============================================================
-->

<style>
  :root {
    --felt: #12261c;
    --felt-deep: #0a1712;
    --gold: #c9a227;
    --gold-bright: #e6c458;
    --cream: #efe6d3;
    --burgundy: #7a1f2b;
    --ink: #0b0e0c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse at top, #1a3327 0%, var(--felt) 45%, var(--felt-deep) 100%);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color: var(--cream);
  }

  body {
    padding: 40px 16px 80px;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  .card-suits {
    text-align: center;
    letter-spacing: 0.6em;
    font-size: 14px;
    color: var(--gold);
    opacity: 0.7;
    margin-bottom: 8px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  h1 {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: clamp(28px, 5vw, 40px);
    text-align: center;
    margin: 0 0 4px;
    color: var(--gold-bright);
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }

  .subtitle {
    text-align: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.6;
    margin: 0 0 32px;
  }

  .panel {
    background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.4));
    border: 1px solid rgba(201,162,39,0.35);
    border-radius: 18px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    margin-bottom: 24px;
  }

  .panel h2 {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 18px;
  }

  .tally-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .tally-name {
    width: 130px;
    min-width: 130px;
    font-size: 14px;
    color: var(--cream);
  }

  .tally-bar-track {
    flex: 1;
    height: 14px;
    background: rgba(239,230,211,0.1);
    border-radius: 7px;
    overflow: hidden;
  }

  .tally-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    border-radius: 7px;
    transition: width 0.4s ease;
  }

  .tally-count {
    width: 28px;
    text-align: right;
    font-size: 14px;
    color: var(--gold-bright);
    font-weight: bold;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
  }

  thead th {
    text-align: left;
    padding: 8px 10px;
    color: var(--gold);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(201,162,39,0.35);
  }

  tbody td {
    padding: 10px;
    border-bottom: 1px solid rgba(239,230,211,0.08);
    color: var(--cream);
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .empty, .loading, .error-state {
    text-align: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--cream);
    opacity: 0.6;
    padding: 30px 10px;
    font-size: 14px;
  }

  .error-state {
    color: #e8a3a3;
    opacity: 0.9;
  }

  .refresh-btn {
    display: block;
    margin: 0 auto;
    padding: 12px 22px;
    border: 1px solid rgba(201,162,39,0.5);
    border-radius: 10px;
    background: transparent;
    color: var(--gold-bright);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .refresh-btn:hover {
    background: rgba(201,162,39,0.12);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="card-suits">♠ ♥ ♦ ♣</div>
  <h1>The Guesses So Far</h1>
  <p class="subtitle">The Golden Chip Casino — detective log</p>

  <div class="panel">
    <h2>Tally</h2>
    <div id="tallyBox">
      <div class="loading">Loading tally…</div>
    </div>
  </div>

  <div class="panel">
    <h2>Every Guess</h2>
    <div id="tableBox">
      <div class="loading">Loading guesses…</div>
    </div>
  </div>

  <button class="refresh-btn" id="refreshBtn">Refresh</button>
</div>

<script>
  // ============================================================
  // EDIT THESE TWO LINES — same values as who_killed_bob.html
  // ============================================================
  const SUPABASE_URL = "https://ritfptgrnibsvzuuhrwe.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_PTo1DchIjO7VRlyiCh5APw_tVlBYwop";
  // ============================================================

  const tallyBox = document.getElementById("tallyBox");
  const tableBox = document.getElementById("tableBox");
  const refreshBtn = document.getElementById("refreshBtn");

  async function loadGuesses() {
    tallyBox.innerHTML = '<div class="loading">Loading tally…</div>';
    tableBox.innerHTML = '<div class="loading">Loading guesses…</div>';

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/guesses?select=guesser_name,suspect,created_at&order=created_at.desc`,
        {
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          }
        }
      );

      if (!response.ok) {
        throw new Error("Fetch failed");
      }

      const rows = await response.json();
      renderTally(rows);
      renderTable(rows);

    } catch (err) {
      tallyBox.innerHTML = '<div class="error-state">Couldn\'t load results. Check your Supabase URL, key, and that read access is enabled (see instructions at the top of this file).</div>';
      tableBox.innerHTML = "";
    }
  }

  function renderTally(rows) {
    if (rows.length === 0) {
      tallyBox.innerHTML = '<div class="empty">No guesses yet.</div>';
      return;
    }

    const counts = {};
    rows.forEach(r => {
      counts[r.suspect] = (counts[r.suspect] || 0) + 1;
    });

    const max = Math.max(...Object.values(counts));
    const suspects = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);

    tallyBox.innerHTML = suspects.map(name => {
      const count = counts[name];
      const pct = Math.round((count / max) * 100);
      return `
        <div class="tally-row">
          <div class="tally-name">${escapeHtml(name)}</div>
          <div class="tally-bar-track">
            <div class="tally-bar-fill" style="width:${pct}%"></div>
          </div>
          <div class="tally-count">${count}</div>
        </div>
      `;
    }).join("");
  }

  function renderTable(rows) {
    if (rows.length === 0) {
      tableBox.innerHTML = '<div class="empty">No guesses yet.</div>';
      return;
    }

    const tableRows = rows.map(r => {
      const time = new Date(r.created_at).toLocaleString();
      return `
        <tr>
          <td>${escapeHtml(r.guesser_name)}</td>
          <td>${escapeHtml(r.suspect)}</td>
          <td>${escapeHtml(time)}</td>
        </tr>
      `;
    }).join("");

    tableBox.innerHTML = `
      <table>
        <thead>
          <tr><th>Name</th><th>Guess</th><th>Submitted</th></tr>
        </thead>
        <tbody>${tableRows}</tbody>
      </table>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  refreshBtn.addEventListener("click", loadGuesses);
  loadGuesses();
</script>

</body>
</html>
