<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Killed Bob? — The Golden Chip Casino</title>

<!--
  ============================================================
  SETUP INSTRUCTIONS (read before hosting this file)
  ============================================================

  This page collects each guest's guess and sends it to a
  Supabase table. You need your own free Supabase project.

  STEP 1 — Create a Supabase project
    Go to https://supabase.com, sign up, and create a new project.

  STEP 2 — Create the table
    In your Supabase project, open the "SQL Editor" and run:

      create table guesses (
        id uuid primary key default gen_random_uuid(),
        guesser_name text not null,
        suspect text not null,
        created_at timestamp with time zone default now()
      );

      alter table guesses enable row level security;

      create policy "Allow public inserts"
      on guesses for insert
      to anon
      with check (true);

  STEP 3 — Get your credentials
    In your Supabase project, go to Project Settings > API.
    Copy the "Project URL" and the "anon public" API key.

  STEP 4 — Paste them below
    Replace SUPABASE_URL and SUPABASE_ANON_KEY in the <script>
    at the bottom of this file with your own values.

  STEP 5 — Host the file
    Upload this HTML file to any free static host, e.g.
    Netlify Drop (https://app.netlify.com/drop), GitHub Pages,
    or Google Sites. You'll get a real URL you can turn into
    a QR code (just paste that URL into any free QR generator,
    like https://www.qr-code-generator.com).

  This page does NOT reveal who the real killer is — it only
  records each guess. You control the reveal yourself, in
  person, whenever you're ready.
  ============================================================
-->

<style>
  :root {
    --felt: #12261c;
    --felt-deep: #0a1712;
    --gold: #c9a227;
    --gold-bright: #e6c458;
    --cream: #efe6d3;
    --burgundy: #7a1f2b;
    --ink: #0b0e0c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse at top, #1a3327 0%, var(--felt) 45%, var(--felt-deep) 100%);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    color: var(--cream);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .table-felt {
    width: 100%;
    max-width: 560px;
    position: relative;
  }

  .card-suits {
    text-align: center;
    letter-spacing: 0.6em;
    font-size: 14px;
    color: var(--gold);
    opacity: 0.7;
    margin-bottom: 8px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  h1 {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: clamp(32px, 6vw, 48px);
    text-align: center;
    margin: 0 0 4px;
    color: var(--gold-bright);
    letter-spacing: 0.01em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }

  .subtitle {
    text-align: center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 14px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.65;
    margin: 0 0 32px;
  }

  .panel {
    background: linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.4));
    border: 1px solid rgba(201,162,39,0.35);
    border-radius: 18px;
    padding: 28px 24px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  label {
    display: block;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  input[type="text"] {
    width: 100%;
    padding: 13px 14px;
    border-radius: 10px;
    border: 1px solid rgba(239,230,211,0.25);
    background: rgba(11,14,12,0.5);
    color: var(--cream);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 16px;
    margin-bottom: 26px;
    outline: none;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  input[type="text"]:focus {
    border-color: var(--gold);
    background: rgba(11,14,12,0.75);
  }

  .suspects {
    display: grid;
    gap: 12px;
    margin-bottom: 8px;
  }

  .chip {
    position: relative;
  }

  .chip input {
    position: absolute;
    opacity: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
  }

  .chip label {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(239,230,211,0.18);
    background: rgba(11,14,12,0.35);
    cursor: pointer;
    text-transform: none;
    letter-spacing: normal;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }

  .chip label:hover {
    border-color: rgba(201,162,39,0.6);
  }

  .chip input:checked + label {
    border-color: var(--gold-bright);
    background: rgba(201,162,39,0.14);
    box-shadow: 0 0 0 1px rgba(201,162,39,0.4) inset;
  }

  .chip-dot {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--burgundy), #4a0f16 70%);
    border: 2px dashed rgba(239,230,211,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--cream);
    font-family: Georgia, serif;
  }

  .chip-text .name {
    font-size: 16px;
    color: var(--cream);
    font-weight: bold;
  }

  .chip-text .role {
    font-size: 13px;
    color: var(--cream);
    opacity: 0.6;
    margin-top: 2px;
  }

  button#submitBtn {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(201,162,39,0.25);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  button#submitBtn:hover {
    transform: translateY(-1px);
    box-shadow: 0 10px 26px rgba(201,162,39,0.35);
  }

  button#submitBtn:active {
    transform: translateY(0);
  }

  button#submitBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .error {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    color: #e8a3a3;
    margin-top: 10px;
    min-height: 16px;
  }

  .result {
    display: none;
    text-align: center;
    padding: 40px 10px;
  }

  .result.show {
    display: block;
  }

  .result .seal {
    font-size: 42px;
    margin-bottom: 14px;
  }

  .result h2 {
    font-family: 'Playfair Display', Georgia, serif;
    color: var(--gold-bright);
    font-size: 26px;
    margin: 0 0 10px;
  }

  .result p {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--cream);
    opacity: 0.75;
    font-size: 14px;
    line-height: 1.6;
    max-width: 360px;
    margin: 0 auto;
  }

  form.hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="table-felt">
  <div class="card-suits">♠ ♥ ♦ ♣</div>
  <h1>Who Killed Bob?</h1>
  <p class="subtitle">The Golden Chip Casino — cast your guess</p>

  <div class="panel">

    <form id="guessForm">
      <label for="guesserName">Your name</label>
      <input type="text" id="guesserName" placeholder="Enter your name" autocomplete="off" required>

      <label>Who do you think did it?</label>
      <div class="suspects">

        <div class="chip">
          <input type="radio" name="suspect" id="suspect-matt" value="Mr. Matt">
          <label for="suspect-matt">
            <span class="chip-dot">♣</span>
            <span class="chip-text">
              <div class="name">Mr. Matt</div>
              <div class="role">Host of the card game</div>
            </span>
          </label>
        </div>

        <div class="chip">
          <input type="radio" name="suspect" id="suspect-owen" value="Mr. Owen">
          <label for="suspect-owen">
            <span class="chip-dot">♦</span>
            <span class="chip-text">
              <div class="name">Mr. Owen</div>
              <div class="role">A friend in the card circle</div>
            </span>
          </label>
        </div>

        <div class="chip">
          <input type="radio" name="suspect" id="suspect-shine" value="Miss Shine">
          <label for="suspect-shine">
            <span class="chip-dot">♥</span>
            <span class="chip-text">
              <div class="name">Miss Shine</div>
              <div class="role">A friend in the card circle</div>
            </span>
          </label>
        </div>

        <div class="chip">
          <input type="radio" name="suspect" id="suspect-daisy" value="Daisy the Maid">
          <label for="suspect-daisy">
            <span class="chip-dot">♠</span>
            <span class="chip-text">
              <div class="name">Daisy the Maid</div>
              <div class="role">Mr. Matt's household maid</div>
            </span>
          </label>
        </div>

      </div>

      <div class="error" id="errorMsg"></div>

      <button type="submit" id="submitBtn">Lock in your guess</button>
    </form>

    <div class="result" id="resultPanel">
      <div class="seal">🔒</div>
      <h2>Guess locked in.</h2>
      <p>Your answer has been recorded. The real killer will be revealed later — good luck, detective.</p>
    </div>

  </div>
</div>

<script>
  // ============================================================
  // EDIT THESE TWO LINES WITH YOUR OWN SUPABASE PROJECT DETAILS
  // Find them in Supabase: Project Settings > API
  // ============================================================
  const SUPABASE_URL = "https://ritfptgrnibsvzuuhrwe.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_PTo1DchIjO7VRlyiCh5APw_tVlBYwop";
  // ============================================================

  const form = document.getElementById("guessForm");
  const errorMsg = document.getElementById("errorMsg");
  const submitBtn = document.getElementById("submitBtn");
  const resultPanel = document.getElementById("resultPanel");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorMsg.textContent = "";

    const guesserName = document.getElementById("guesserName").value.trim();
    const suspectInput = document.querySelector('input[name="suspect"]:checked');

    if (!guesserName) {
      errorMsg.textContent = "Enter your name before locking in a guess.";
      return;
    }
    if (!suspectInput) {
      errorMsg.textContent = "Choose a suspect before locking in a guess.";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Locking in...";

    try {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/guesses`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({
          guesser_name: guesserName,
          suspect: suspectInput.value
        })
      });

      if (!response.ok) {
        throw new Error("Submission failed");
      }

      form.classList.add("hidden");
      resultPanel.classList.add("show");

    } catch (err) {
      errorMsg.textContent = "Something went wrong. Please try again.";
      submitBtn.disabled = false;
      submitBtn.textContent = "Lock in your guess";
    }
  });
</script>

</body>
</html>
